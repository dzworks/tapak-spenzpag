<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>TAPAK - SMP Negeri 1 Pagaden</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #080c17; color: #f1f5f9; }
    
    @keyframes pulseRing {
      0% { transform: scale(0.95); opacity: 0.8; }
      50% { transform: scale(1.08); opacity: 0.2; }
      100% { transform: scale(0.95); opacity: 0.8; }
    }
    .animate-pulse-ring { animation: pulseRing 3s infinite ease-in-out; }
    
    @keyframes scanLine {
      0% { top: 0%; opacity: 0.8; }
      50% { opacity: 1; }
      100% { top: 92%; opacity: 0.8; }
    }
    .animate-scan-line { animation: scanLine 2s infinite ease-in-out; }
    
    #reader video {
      object-fit: cover !important;
      border-radius: 1rem;
      width: 100% !important;
      height: 100% !important;
    }
    #reader__dashboard_section_csr { display: none !important; }
    
    @keyframes indeterminate {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(200%); }
    }
    .animate-indeterminate {
      animation: indeterminate 1.5s infinite linear;
    }
  </style>
</head>
<body class="selection:bg-blue-500 selection:text-white">

  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // ==========================================
    // MASUKKAN URL GOOGLE APPS SCRIPT DI SINI (Pastikan berakhiran /exec)
    // Dilarang mengubah URL ini sesuai instruksi
    // ==========================================
    const API_URL = "https://script.google.com/macros/s/AKfycbwkb_jsbOzYkAKSIdKZeU2Ywy3Bjey9M7qygDpEN-mojXNvtNvaV78y2S-G3Swz7qC-/exec"; 
    
    // Fungsi generateIdKiriman (Acak) telah dihapus karena ID kini digenerate secara terstruktur di dalam submitData

    // SVG Icons
    const CameraIcon = ({ className="w-6 h-6" }) => (<svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"></path><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>);
    const HeartIcon = ({ className="w-5 h-5" }) => (<svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4.318 6.318a4.5 4.5 0 016.364 0L12 7.636l1.318-1.318a4.5 4.5 0 016.364 6.364L12 21.364l-7.682-7.682a4.5 4.5 0 010-6.364z"></path></svg>);
    const CloseIcon = ({ className="w-6 h-6" }) => (<svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M6 18L18 6M6 6l12 12"></path></svg>);
    const SpinnerIcon = ({ className="w-6 h-6" }) => (<svg className={`animate-spin ${className}`} fill="none" viewBox="0 0 24 24"><circle className="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" strokeWidth="4"></circle><path className="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>);
    const CheckCircleIcon = ({ className="w-12 h-12" }) => (<svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>);
    
    // Ikon untuk Desain Jadwal & Rescan
    const ClockIcon = ({ className="w-3 h-3" }) => (<svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>);
    const LocationIcon = ({ className="w-3 h-3" }) => (<svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"></path><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>);
    const BookIcon = ({ className="w-3.5 h-3.5" }) => (<svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"></path></svg>);
    const NextIcon = ({ className="w-3 h-3" }) => (<svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M13 5l7 7-7 7M5 5l7 7-7 7"></path></svg>);
    const RefreshIcon = ({ className="w-3.5 h-3.5" }) => (<svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>);
    const AlertIcon = ({ className="w-6 h-6" }) => (<svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg>);

    const playSuccessChime = () => {
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return;
        const ctx = new AudioCtx();
        const now = ctx.currentTime;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(523.25, now);
        osc.frequency.exponentialRampToValueAtTime(783.99, now + 0.15);
        gain.gain.setValueAtTime(0.15, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.4);
        osc.connect(gain); gain.connect(ctx.destination);
        osc.start(now); osc.stop(now + 0.4);
      } catch (e) { }
    };

    function App() {
      const [time, setTime] = useState('');
      const [dateStr, setDateStr] = useState('');
      const [currentDay, setCurrentDay] = useState('');
      
      const [localCache, setLocalCache] = useState(null);
      const [syncStatus, setSyncStatus] = useState('idle'); 

      const [isModalOpen, setIsModalOpen] = useState(false);
      const [modalPhase, setModalPhase] = useState('CLOSED'); 
      const [apiError, setApiError] = useState(null);
      
      const [cameras, setCameras] = useState([]);
      const [selectedCameraId, setSelectedCameraId] = useState('');
      const html5QrCodeRef = useRef(null);

      const [kegiatan, setKegiatan] = useState('');
      const [kegiatanError, setKegiatanError] = useState(false);
      const [isPengganti, setIsPengganti] = useState(false);
      const [scanResult, setScanResult] = useState(null);
      const [scannedToken, setScannedToken] = useState('');
      const [showConfirmation, setShowConfirmation] = useState(false);

      useEffect(() => {
        const updateClock = () => {
          const now = new Date();
          const hours = String(now.getHours()).padStart(2, '0');
          const minutes = String(now.getMinutes()).padStart(2, '0');
          const seconds = String(now.getSeconds()).padStart(2, '0');
          setTime(`${hours}:${minutes}:${seconds} WIB`);

          const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
          setDateStr(now.toLocaleDateString('id-ID', options));
          
          const days = ['Minggu', 'Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat', 'Sabtu'];
          setCurrentDay(days[now.getDay()]);
        };
        updateClock();
        const timer = setInterval(updateClock, 1000);
        return () => clearInterval(timer);
      }, []);

      useEffect(() => {
        if (!currentDay || syncStatus !== 'idle') return;
        
        const fetchScheduleLocally = async () => {
          setSyncStatus('syncing');
          if (API_URL.includes("ISI_DENGAN")) {
              setTimeout(() => {
                  setLocalCache({
                    classes: { "SIMULASI-123": { id_kelas: "K-01", nama_kelas: "Kelas VII A", lokasi_ruang: "Ruang 1" } },
                    schedules: { "Kelas VII A": [{ jam_ke: "1-2", mapel_ke: "1", jam_mulai: "07:00", jam_selesai: "23:00", nama_guru: "Drs. Budi Santoso", mata_pelajaran: "Matematika", nip: "123456", kode_guru: "G-01" }] }
                  });
                  setSyncStatus('success');
              }, 1000);
              return;
          }

          try {
            const response = await fetch(`${API_URL}?action=init&hariIni=${currentDay}`);
            const resData = await response.json();
            
            if (resData.status === 'success') {
              setLocalCache(resData.data);
              setSyncStatus('success');
            } else {
              setSyncStatus('error');
            }
          } catch (error) {
            setSyncStatus('error');
          }
        };

        fetchScheduleLocally();
      }, [currentDay, syncStatus]);

      const handleQrMatch = (token) => {
        setScannedToken(token);
        
        if (!localCache || !localCache.classes) {
          setApiError('Aplikasi masih mengunduh jadwal. Tunggu sebentar.');
          setModalPhase('ERROR');
          return;
        }

        const kelas = localCache.classes[token.trim()];
        if (!kelas) {
          setApiError('QR Code tidak dikenali oleh sistem.');
          setModalPhase('ERROR');
          return;
        }

        const schedules = localCache.schedules[kelas.nama_kelas.trim()];
        
        // Cari Jadwal Saat Ini & Jadwal Selanjutnya
        let activeSched = null;
        let nextSched = null;

        if (schedules && schedules.length > 0) {
          const now = new Date();
          const currentMinutes = now.getHours() * 60 + now.getMinutes();

          for (let i = 0; i < schedules.length; i++) {
            const sched = schedules[i];
            if (!sched.jam_mulai || !sched.jam_selesai) continue;
            
            const startParts = sched.jam_mulai.toString().replace('.', ':').split(':');
            const endParts = sched.jam_selesai.toString().replace('.', ':').split(':');
            if (startParts.length < 2 || endParts.length < 2) continue;

            const startMins = parseInt(startParts[0]) * 60 + parseInt(startParts[1]);
            const endMins = parseInt(endParts[0]) * 60 + parseInt(endParts[1]);

            if (currentMinutes >= startMins && currentMinutes <= endMins) {
              activeSched = sched;
              // Jika ini jadwal yang cocok, intip 1 jadwal setelahnya
              if (i + 1 < schedules.length) {
                nextSched = schedules[i + 1];
              }
              break;
            }
          }
        }

        if (activeSched) {
          setScanResult({
            id_kelas: kelas.id_kelas, 
            nama_kelas: kelas.nama_kelas, 
            lokasi_ruang: kelas.lokasi_ruang,
            jam_ke: activeSched.jam_ke,
            mapel_ke: activeSched.mapel_ke,
            kode_guru: activeSched.kode_guru,
            teacherName: activeSched.nama_guru, 
            nip: activeSched.nip, 
            subject: activeSched.mata_pelajaran,
            waktu_mulai: activeSched.jam_mulai, 
            waktu_selesai: activeSched.jam_selesai,
            // Info Guru Selanjutnya
            nextTeacher: nextSched ? { nama: nextSched.nama_guru, mapel: nextSched.mata_pelajaran } : null
          });
        } else {
          setScanResult({
            id_kelas: kelas.id_kelas, 
            nama_kelas: kelas.nama_kelas, 
            lokasi_ruang: kelas.lokasi_ruang,
            jam_ke: "-",
            mapel_ke: "-",
            kode_guru: "-",
            teacherName: "Luar Jam Pelajaran", 
            nip: "-", 
            subject: "Kegiatan Ekstra/Kosong",
            waktu_mulai: "-", 
            waktu_selesai: "-",
            nextTeacher: null
          });
        }
        setModalPhase('FORM');
        playSuccessChime();
      };

      const handleStartCamera = () => {
        setIsModalOpen(true);
        setModalPhase('PERMISSION');
        setApiError(null);

        Html5Qrcode.getCameras().then(devices => {
          if (devices && devices.length > 0) {
            setCameras(devices);
            let defaultCam = devices[0].id;
            for (let i = 0; i < devices.length; i++) {
              let label = devices[i].label.toLowerCase();
              if (label.includes("back") || label.includes("belakang") || label.includes("environment")) {
                defaultCam = devices[i].id;
                break;
              }
            }
            setSelectedCameraId(defaultCam);
            setModalPhase('SCANNING');
          } else {
            setApiError("Kamera tidak terdeteksi di perangkat Anda.");
            setModalPhase('ERROR');
          }
        }).catch(err => {
           setApiError("Izin kamera ditolak. Mohon izinkan akses kamera pada pop-up browser.");
           setModalPhase('ERROR');
        });
      };

      useEffect(() => {
        let scanner = null;
        if (isModalOpen && modalPhase === 'SCANNING' && selectedCameraId) {
          scanner = new Html5Qrcode("reader");
          html5QrCodeRef.current = scanner;
          
          const config = { 
            fps: 15, 
            qrbox: (vw, vh) => {
              // Pengaman: memastikan ukuran minimal qrbox adalah 200px agar tidak terjadi error saat render awal
              const size = Math.max(200, Math.min(vw, vh) * 0.75);
              return { width: size, height: size };
            }, 
            aspectRatio: 1.0 
          };

          scanner.start(
            selectedCameraId, config,
            (decodedText) => { if (scanner.isScanning) scanner.stop(); handleQrMatch(decodedText); },
            () => {}
          ).catch(err => { console.warn("Camera init failed:", err); });
        }
        return () => { if (scanner && scanner.isScanning) scanner.stop().catch(e=>console.log(e)); };
      }, [isModalOpen, modalPhase, selectedCameraId]);

      const submitData = async () => {
        setModalPhase('LOADING');
        
        // Format: DDMMYYYY + NAMA KELAS (Tanpa Spasi/Simbol) + MAPEL + KODE GURU
        const d = new Date();
        const dd = String(d.getDate()).padStart(2, '0');
        const mm = String(d.getMonth() + 1).padStart(2, '0');
        const yyyy = d.getFullYear();
        
        // Membersihkan karakter selain huruf dan angka
        const cleanClass = scanResult.nama_kelas ? scanResult.nama_kelas.replace(/[^a-zA-Z0-9]/g, '').toUpperCase() : "UNK";
        const cleanMapel = scanResult.mapel_ke ? scanResult.mapel_ke.toString().replace(/[^a-zA-Z0-9]/g, '').toUpperCase() : "0";
        const cleanGuru = scanResult.kode_guru ? scanResult.kode_guru.toString().replace(/[^a-zA-Z0-9]/g, '').toUpperCase() : "UNK";
        
        const structuredId = `${dd}${mm}${yyyy}${cleanClass}${cleanMapel}${cleanGuru}`;

        const payload = {
          qr_code: scannedToken,
          id_kiriman: structuredId,
          kegiatan_pembelajaran: kegiatan.trim() !== '' ? kegiatan : '-',
          pengganti: isPengganti ? 'Y' : 'N',
          data_jadwal: scanResult
        };

        if (API_URL.includes("ISI_DENGAN")) {
             setTimeout(() => {
                setScanResult({ ...scanResult, timestamp: new Date().toLocaleTimeString('id-ID') });
                setModalPhase('SUCCESS'); playSuccessChime();
             }, 1000);
             return;
        }

        try {
          const response = await fetch(API_URL, {
            method: 'POST',
            // Trik Bypass CORS Preflight GAS
            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
            body: JSON.stringify({ action: 'submit', payload: payload })
          });
          
          const resData = await response.json();
          if (resData.status === 'success') {
            playSuccessChime();
            setScanResult({ ...scanResult, timestamp: resData.data.waktu_absen });
            setModalPhase('SUCCESS');
          } else {
            setApiError(resData.message || 'Gagal menyimpan data.');
            setModalPhase('ERROR');
          }
        } catch (err) {
          setApiError('Koneksi terputus ke server.');
          setModalPhase('ERROR');
        }
      };

      const handleCloseModal = () => {
        if (html5QrCodeRef.current?.isScanning) html5QrCodeRef.current.stop().catch(e=>e);
        setIsModalOpen(false); setModalPhase('CLOSED'); setScannedToken('');
        setKegiatan(''); setKegiatanError(false); setIsPengganti(false); setScanResult(null); setCameras([]); setSelectedCameraId('');
        setShowConfirmation(false);
      };

      return (
        <div className="relative flex flex-col justify-between items-center min-h-screen p-5 max-w-md mx-auto overflow-hidden shadow-2xl">
          <div className="absolute top-0 left-1/2 -translate-x-1/2 w-96 h-96 bg-blue-600/10 rounded-full blur-3xl pointer-events-none"></div>

          <header className="z-10 text-center mt-4 w-full space-y-3 flex flex-col items-center">
            <h1 className="text-[4rem] font-black tracking-widest text-transparent bg-clip-text drop-shadow-md" style={{backgroundImage: 'linear-gradient(90deg, #44d0f5, #3b82f6)'}}>TAPAK</h1>
            <div className="inline-block px-4 py-1.5 rounded-full border shadow-lg backdrop-blur-md" style={{borderColor: '#214e6c', backgroundColor: 'rgba(15, 23, 42, 0.6)'}}>
              <p className="text-[10px] font-semibold text-slate-300 tracking-wide uppercase"><span className="text-cyan-400 font-bold">T</span>ATA KEH<span className="text-cyan-400 font-bold">A</span>DIRAN <span className="text-cyan-400 font-bold">P</span>ENDIDIK DAL<span className="text-cyan-400 font-bold">A</span>M <span className="text-cyan-400 font-bold">K</span>ELAS</p>
            </div>
          </header>

          <div className="z-10 w-full mt-6 rounded-2xl p-4 shadow-lg" style={{backgroundColor: '#16233d', border: '1px solid #1e3a5f'}}>
            <div className="flex items-start gap-4">
              <div className="p-2.5 rounded-xl flex-shrink-0 mt-0.5" style={{backgroundColor: '#1d3257', color: '#60a5fa'}}><HeartIcon className="w-5 h-5" /></div>
              <div className="flex-1 text-left">
                <p className="text-xs font-bold text-blue-200 leading-snug">Selamat datang, Bapak/Ibu Guru hebat.</p>
                <p className="text-[11px] text-slate-300 leading-relaxed mt-1.5 opacity-90">Terima kasih atas dedikasi tiada henti bagi anak bangsa. Jangan khawatir, TAPAK hadir untuk mempermudah tugas Anda.</p>
              </div>
            </div>
          </div>

          <main className="z-10 my-auto flex flex-col items-center justify-center w-full py-4 mt-8">
            
            {/* AREA TANGGAL & PROGRESS BAR */}
            <div className="flex flex-col items-center justify-center mb-8 text-center w-full">
              <span className="text-[2.25rem] font-mono font-bold tracking-widest drop-shadow-md" style={{color: '#6e9fe5'}}>{time || '00:00:00 WIB'}</span>
              
              <div className="flex flex-col items-center mt-2 w-full max-w-[220px]">
                <span className="text-xs font-medium text-slate-300 mb-2.5">{dateStr}</span>
                
                {/* Teks Status */}
                <div className="flex flex-col items-center transition-colors duration-300 mt-1 text-center">
                  {syncStatus === 'syncing' && (
                    <>
                      <span className="text-[10px] font-bold tracking-wider uppercase text-blue-400 animate-pulse">Menyinkronkan Jadwal...</span>
                      <span className="text-[9px] font-medium text-slate-500 normal-case tracking-normal mt-1">Pastikan Anda memiliki koneksi internet</span>
                    </>
                  )}
                  {syncStatus === 'success' && (
                    <span className="text-[10px] font-bold tracking-wider uppercase text-emerald-400">Aplikasi Siap Digunakan</span>
                  )}
                  {syncStatus === 'error' && (
                    <>
                      <span className="text-[10px] font-bold tracking-wider uppercase text-rose-400">Gagal Memuat Jadwal</span>
                      <span className="text-[9px] font-medium text-slate-500 normal-case tracking-normal mt-1">Periksa koneksi internet Anda dan muat ulang halaman.</span>
                    </>
                  )}
                </div>
              </div>
            </div>

            {/* AREA TOMBOL UTAMA BEKU (DISABLED) */}
            <div className="relative group flex items-center justify-center mb-12 mt-4">
              
              {/* Progress Ring (Muncul saat Syncing) */}
              {syncStatus === 'syncing' && (
                <div className="absolute -inset-3.5 rounded-full border-[3px] border-slate-700/50 border-t-blue-400 border-r-blue-400 animate-spin shadow-[0_0_15px_rgba(96,165,250,0.3)]"></div>
              )}

              {/* Pulse Ring (Muncul saat Success) */}
              {syncStatus === 'success' && (
                <div className="absolute inset-0 rounded-full animate-pulse-ring" style={{backgroundColor: 'rgba(59, 130, 246, 0.4)'}}></div>
              )}
              
              <button 
                onClick={handleStartCamera} 
                disabled={syncStatus !== 'success'}
                className={`relative flex flex-col items-center justify-center w-40 h-40 rounded-full shadow-2xl transition-all duration-500 ${syncStatus === 'success' ? 'active:scale-95 cursor-pointer hover:shadow-[0_0_30px_rgba(59,130,246,0.3)]' : 'cursor-not-allowed grayscale opacity-75'}`}
                style={
                  syncStatus === 'success'
                  ? { background: 'linear-gradient(145deg, #324fa3, #243575)', border: '2px solid #486ae0' }
                  : { background: 'linear-gradient(145deg, #1e293b, #0f172a)', border: '2px solid #334155' }
                }
              >
                <div className={`p-3 mb-2 rounded-2xl border pointer-events-none transition-colors duration-500 ${syncStatus === 'success' ? 'bg-white/10 border-white/20' : 'bg-slate-800/80 border-slate-700/80'}`}>
                  <CameraIcon className={`w-8 h-8 transition-colors duration-500 ${syncStatus === 'success' ? 'text-white' : 'text-slate-500'}`} />
                </div>
                <span className={`text-sm font-bold tracking-wide pointer-events-none transition-colors duration-500 ${syncStatus === 'success' ? 'text-white' : 'text-slate-400'}`}>Mulai Absen</span>
                <span className={`text-[10px] mt-0.5 pointer-events-none transition-colors duration-500 ${syncStatus === 'success' ? 'text-blue-200 opacity-80' : 'text-slate-500'}`}>
                  {syncStatus === 'success' ? 'Ketuk Kamera' : 'Menunggu Jadwal'}
                </span>
              </button>
            </div>

            <div className="w-full rounded-2xl p-4 text-left space-y-3.5 text-[11px] text-slate-300 shadow-md" style={{backgroundColor: '#131c33', border: '1px solid #1e2c4a'}}>
              <div className="flex items-start gap-3"><span className="flex items-center justify-center w-5 h-5 rounded-full font-bold text-[10px] flex-shrink-0 mt-0.5" style={{backgroundColor: '#1d3257', color: '#60a5fa'}}>1</span><p>Ketuk tombol <strong className="text-white">Mulai Absen</strong> di tengah layar.</p></div>
              <div className="flex items-start gap-3"><span className="flex items-center justify-center w-5 h-5 rounded-full font-bold text-[10px] flex-shrink-0 mt-0.5" style={{backgroundColor: '#1d3257', color: '#60a5fa'}}>2</span><p>Izinkan akses kamera pada pop-up browser Anda.</p></div>
              <div className="flex items-start gap-3"><span className="flex items-center justify-center w-5 h-5 rounded-full font-bold text-[10px] flex-shrink-0 mt-0.5" style={{backgroundColor: '#1d3257', color: '#60a5fa'}}>3</span><p>Arahkan kamera ke Kode QR di kelas Anda.</p></div>
            </div>
          </main>

          <footer className="z-10 w-full text-center py-4"><h2 className="text-xs font-bold text-slate-300 tracking-wide">SMP Negeri 1 Pagaden</h2></footer>

          {}
          {isModalOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 backdrop-blur-md" style={{backgroundColor: 'rgba(5, 8, 18, 0.85)'}}>
              <div className="relative w-full max-w-sm rounded-3xl shadow-2xl overflow-hidden flex flex-col" style={{backgroundColor: '#0f172a', border: '1px solid #1e293b'}}>
                
                <div className="flex items-center justify-between px-5 py-4 border-b" style={{borderColor: '#1e293b', backgroundColor: '#111827'}}>
                  <span className="text-sm font-bold text-slate-200">{(modalPhase === 'PERMISSION' ? 'Otorisasi' : (modalPhase === 'SCANNING' ? 'Pindai QR' : 'Sistem'))}</span>
                  <button onClick={handleCloseModal} className="p-1 rounded-full text-slate-400 hover:text-white hover:bg-slate-800 transition-colors"><CloseIcon className="w-6 h-6" /></button>
                </div>

                <div className="p-5 flex flex-col items-center justify-center min-h-[300px]">
                  
                  {modalPhase === 'PERMISSION' && (
                    <div className="flex flex-col items-center justify-center py-10 text-center"><SpinnerIcon className="w-12 h-12 text-blue-400 mb-4" />
                      <p className="text-sm font-semibold text-slate-200">Meminta Akses Kamera</p>
                      <p className="text-[11px] text-slate-400 mt-2">Mohon ketuk <strong>"Allow/Izinkan"</strong> di browser Anda.</p>
                    </div>
                  )}

                  {modalPhase === 'SCANNING' && (
                    <div className="flex flex-col items-center w-full">
                      <div className="relative w-64 h-64 rounded-2xl overflow-hidden bg-black border-2 border-blue-500/40 shadow-inner mb-4">
                        <div id="reader" className="w-full h-full"></div>
                        <div className="absolute inset-0 pointer-events-none p-4"><div className="w-full h-0.5 mt-8 shadow-[0_0_12px_#3b82f6] relative animate-scan-line" style={{background: 'linear-gradient(90deg, transparent, #3b82f6, transparent)'}}></div></div>
                      </div>
                      {cameras.length > 0 && (
                        <div className="w-full mt-2">
                          <label className="block text-[10px] text-slate-400 font-bold mb-1.5 uppercase text-center">Ganti Kamera Jika Buram/Salah</label>
                          <select value={selectedCameraId} onChange={(e) => setSelectedCameraId(e.target.value)} className="w-full bg-slate-900 border border-slate-700 rounded-xl p-2.5 text-xs text-slate-200 focus:outline-none focus:border-blue-500 text-center">
                            {cameras.map((cam, idx) => (<option key={cam.id} value={cam.id}>{cam.label || `Kamera ${idx + 1}`}</option>))}
                          </select>
                        </div>
                      )}
                    </div>
                  )}

                  {}
                  {modalPhase === 'FORM' && scanResult && (
                    <div className="w-full animate-in fade-in zoom-in-95 duration-300">
                      
                      {/* DESAIN KOTAK JADWAL BARU */}
                      <div className="rounded-2xl p-4 mb-4 shadow-lg relative overflow-hidden border" style={{background: 'linear-gradient(135deg, #1e293b, #0f172a)', borderColor: '#334155'}}>
                        
                        {/* 1. HEADER BLOCK BARU: Kelas & Jam Ke (Bertumpuk) */}
                        <div className="flex flex-col gap-2.5 mb-3 pb-3 border-b" style={{borderColor: 'rgba(51, 65, 85, 0.6)'}}>
                          <div className="flex justify-between items-center w-full">
                            {/* Nama Kelas */}
                            <div className="flex items-center gap-2.5">
                              <div className="relative flex-shrink-0">
                                <div className="absolute inset-0 rounded-full bg-emerald-400 animate-ping opacity-75"></div>
                                <div className="relative w-2.5 h-2.5 rounded-full bg-emerald-500"></div>
                              </div>
                              <span className="text-sm font-black text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-cyan-300 tracking-wide uppercase">
                                {scanResult.nama_kelas}
                              </span>
                            </div>
                            
                            {/* Jam Ke */}
                            <div className="bg-indigo-600/30 border border-indigo-500/50 text-indigo-200 text-xs font-extrabold px-3 py-1.5 rounded-lg shadow-inner">
                              Jam Ke: {scanResult.jam_ke}
                            </div>
                          </div>
                          
                          {/* Mapel Ke */}
                          <div className="flex">
                            <span className="bg-slate-800/80 text-slate-400 text-[10px] font-semibold px-2.5 py-1 rounded-md border border-slate-700/60">
                              Mapel Ke-{scanResult.mapel_ke}
                            </span>
                          </div>
                        </div>
                        
                        {/* 2. Bagian Tengah: Nama Guru & Ikon */}
                        <h4 className="text-base font-extrabold text-white mt-3 leading-tight">{scanResult.teacherName}</h4>
                        <p className="text-xs text-blue-300 font-medium mt-1.5 flex items-center gap-1.5"><BookIcon /> {scanResult.subject}</p>
                        
                        {/* Waktu dan Ruangan */}
                        <div className="flex items-center gap-2 mt-3.5 pt-1 text-[10px] text-slate-400 font-medium">
                          <span className="flex items-center gap-1"><ClockIcon /> {scanResult.waktu_mulai} - {scanResult.waktu_selesai} WIB</span>
                          <span className="text-slate-600">•</span>
                          <span className="flex items-center gap-1"><LocationIcon /> {scanResult.lokasi_ruang}</span>
                        </div>

                        {/* 3. Bagian Bawah: Guru Selanjutnya (Next Up) */}
                        {scanResult.nextTeacher && (
                          <div className="mt-4 pt-3" style={{borderTop: '1px solid rgba(51, 65, 85, 0.6)'}}>
                            <p className="text-[9px] text-slate-500 font-bold uppercase tracking-wider mb-1 flex items-center gap-1"><NextIcon /> Selanjutnya:</p>
                            <p className="text-[11px] text-slate-300 truncate">
                              <span className="font-bold text-slate-200">{scanResult.nextTeacher.nama}</span> <span className="text-slate-500">({scanResult.nextTeacher.mapel})</span>
                            </p>
                          </div>
                        )}
                      </div>
                      {/* AKHIR KOTAK JADWAL BARU */}

                      <div className="space-y-4 w-full">
                        {/* AREA TEXTAREA BARU DENGAN LABEL */}
                        <div className="flex flex-col gap-1.5">
                          <label className="text-[10px] text-slate-400 font-bold uppercase tracking-wider">
                            Kegiatan Pembelajaran Sesi Ini <span className="text-red-500 text-xs">*</span>
                          </label>
                          <textarea 
                            value={kegiatan} 
                            onChange={(e) => {
                              setKegiatan(e.target.value);
                              if (e.target.value.trim() !== '') setKegiatanError(false);
                            }} 
                            placeholder="Tulis ringkasan kegiatan belajar disini..." 
                            className={`w-full bg-slate-900 border rounded-xl p-3 text-sm text-white placeholder:text-slate-600 transition-all resize-none h-20 outline-none ${kegiatanError ? 'border-red-500 focus:border-red-500 shadow-[0_0_8px_rgba(239,68,68,0.4)]' : 'border-slate-700 focus:border-blue-500'}`}
                          ></textarea>
                          {kegiatanError && (
                            <span className="text-[10px] text-red-400 font-medium animate-pulse mt-0.5">
                              Keterangan kegiatan pembelajaran wajib diisi sebelum mengirim presensi.
                            </span>
                          )}
                        </div>
                        
                        <label className="flex items-center gap-3 p-3 border border-slate-700 rounded-xl cursor-pointer" style={{backgroundColor: '#131e33'}}>
                          <div className="relative flex items-center">
                            <input type="checkbox" checked={isPengganti} onChange={(e) => setIsPengganti(e.target.checked)} className="sr-only peer" />
                            <div className="w-5 h-5 border-2 border-slate-500 rounded peer-checked:bg-blue-500 peer-checked:border-blue-500" style={{backgroundColor: '#0f172a'}}></div>
                            <svg className="absolute w-3 h-3 text-white opacity-0 peer-checked:opacity-100 pointer-events-none" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="3"><path strokeLinecap="round" strokeLinejoin="round" d="M5 13l4 4L19 7" /></svg>
                          </div>
                          <div className="flex flex-col"><span className="text-sm font-semibold text-slate-200">Guru Pengganti</span><span className="text-[10px] text-slate-400">Centang jika inval.</span></div>
                        </label>
                      </div>

                      <button onClick={() => {
                        if (kegiatan.trim() === '') {
                          setKegiatanError(true);
                        } else {
                          setShowConfirmation(true);
                        }
                      }} className="mt-6 w-full py-3.5 rounded-xl font-bold text-sm shadow-lg text-white transition-transform active:scale-95" style={{background: 'linear-gradient(90deg, #2563eb, #4f46e5)'}}>
                        Kirim Presensi Sekarang
                      </button>

                      {/* TOMBOL SCAN ULANG BARU */}
                      <div className="mt-4 text-center">
                        <p className="text-[11px] text-slate-400">
                          Bukan jadwal Anda?{' '}
                          <button 
                            onClick={() => {
                              setScannedToken('');
                              setKegiatan('');
                              setKegiatanError(false);
                              setIsPengganti(false);
                              setScanResult(null);
                              setShowConfirmation(false);
                              setModalPhase('SCANNING');
                            }}
                            className="text-blue-400 font-bold hover:underline inline-flex items-center gap-1 transition-colors"
                          >
                            <RefreshIcon /> Klik disini untuk scan ulang
                          </button>
                        </p>
                      </div>
                      
                    </div>
                  )}

                  {/* OVERLAY POP-UP KONFIRMASI INTEGRITAS */}
                  {showConfirmation && modalPhase === 'FORM' && (
                    <div className="fixed inset-0 z-[100] flex items-center justify-center p-4 backdrop-blur-md" style={{backgroundColor: 'rgba(15, 23, 42, 0.95)'}}>
                      
                      {/* Kontainer Utama Modal (Berubah jadi flex-col & overflow-hidden) */}
                      <div className="w-full max-w-md max-h-[85vh] flex flex-col border border-slate-200 rounded-2xl shadow-2xl animate-in zoom-in-95 duration-200 bg-slate-50 overflow-hidden">
                        
                        {/* Area Konten: Judul, Pertanyaan & Peringatan (Bisa di-scroll) */}
                        <div className="p-5 overflow-y-auto flex-1">
                          <div className="flex items-center gap-3 mb-5 text-red-600">
                            <AlertIcon className="w-7 h-7 flex-shrink-0" />
                            <h3 className="font-black text-base uppercase tracking-wide">Konfirmasi Integritas</h3>
                          </div>
                          
                          <p className="text-base font-bold text-slate-800 mb-5 leading-relaxed">
                            Apakah Anda mengonfirmasi bahwa presensi ini diisi langsung oleh Guru yang bersangkutan di dalam kelas sesuai jadwal?
                          </p>
                          
                          <div className="bg-red-50 border border-red-200 p-4 rounded-xl mb-4 shadow-sm">
                            <p className="text-sm font-bold text-red-600 leading-relaxed text-justify">
                              Perhatian: Mewakilkan presensi kepada siswa, mengisi di luar ruang kelas, atau menggunakan duplikat QR Code merupakan pelanggaran integritas akademik dan kode etik guru.
                            </p>
                          </div>
                          
                          {/* Micro-copy yang dipisah dengan border tipis */}
                          <div className="border-t border-slate-200 pt-3">
                            <p className="text-[10px] text-slate-500 leading-relaxed text-justify">
                              Sistem mencatat rekam jejak digital secara otomatis. Apabila terdapat kendala atau penyalahgunaan, mohon segera laporkan kepada Kepala Sekolah.
                            </p>
                          </div>
                        </div>
                        
                        {/* Area Footer: Tombol Ya & Batal (Sticky/Beku di bawah + Inverted Shadow) */}
                        <div className="p-4 bg-slate-50 border-t border-slate-100 shadow-[0_-4px_10px_rgba(0,0,0,0.05)]">
                          <div className="flex flex-col gap-2.5">
                            <button 
                              onClick={() => {
                                setShowConfirmation(false);
                                submitData();
                              }}
                              className="w-full py-3.5 rounded-xl font-bold text-sm shadow-md text-white transition-transform active:scale-95 text-center leading-snug px-3" 
                              style={{background: 'linear-gradient(90deg, #0284c7, #2563eb)'}}
                            >
                              Ya, Saya Guru Bersangkutan dan mengisi di dalam kelas sesuai jadwal
                            </button>
                            <button 
                              onClick={() => setShowConfirmation(false)}
                              className="w-full py-3 rounded-xl font-bold text-sm text-slate-500 hover:text-slate-800 hover:bg-slate-200 transition-colors"
                            >
                              Batal
                            </button>
                          </div>
                        </div>

                      </div>
                    </div>
                  )}

                  {modalPhase === 'LOADING' && (
                    <div className="flex flex-col items-center justify-center py-10"><SpinnerIcon className="w-12 h-12 text-blue-400 mb-4" /><p className="text-xs text-slate-300">Menyimpan ke Server...</p></div>
                  )}

                  {modalPhase === 'ERROR' && (
                    <div className="flex flex-col items-center text-center w-full">
                      <div className="p-3 bg-rose-500/10 text-rose-400 border border-rose-500/30 rounded-full mb-3"><CloseIcon className="w-8 h-8" /></div>
                      <p className="text-xs text-slate-300 bg-rose-500/10 border border-rose-500/20 rounded-xl p-3 mb-5 w-full">{apiError}</p>
                      <button onClick={handleStartCamera} className="w-full py-3 rounded-xl bg-slate-800 border border-slate-700 text-cyan-300 font-bold text-xs">Coba Lagi</button>
                    </div>
                  )}

                  {modalPhase === 'SUCCESS' && scanResult && (
                    <div className="flex flex-col items-center text-center w-full">
                      <div className="relative mb-3"><div className="absolute inset-0 rounded-full bg-emerald-500/20 animate-ping"></div><div className="relative p-3 bg-emerald-500/10 text-emerald-400 border border-emerald-500/30 rounded-full"><CheckCircleIcon className="w-12 h-12" /></div></div>
                      <h3 className="text-xl font-extrabold text-emerald-400 mb-4">Berhasil!</h3>
                      <div className="w-full rounded-2xl p-4 text-left space-y-3 text-xs mb-6" style={{backgroundColor: '#162331', border: '1px solid #1e3a47'}}>
                        <div><span className="text-slate-400 text-[10px] uppercase font-semibold">Nama Pendidik</span><p className="text-sm font-bold text-slate-100 mt-0.5">{scanResult.teacherName}</p></div>
                        <div className="grid grid-cols-2 gap-2 pt-2 border-t border-slate-700/50"><div><span className="text-slate-400 text-[10px] uppercase">Waktu Tercatat</span><p className="font-medium text-emerald-400 font-mono mt-0.5">{scanResult.timestamp}</p></div></div>
                      </div>
                      <button onClick={handleCloseModal} className="w-full py-3.5 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white font-bold text-xs">Selesai</button>
                    </div>
                  )}
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }
    
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
